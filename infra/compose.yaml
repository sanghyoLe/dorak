name: dorak-local

services:
  postgres:
    image: postgis/postgis:18-3.6-alpine
    platform: linux/amd64
    environment:
      POSTGRES_DB: dorak
      POSTGRES_USER: dorak
      POSTGRES_PASSWORD: dorak_local_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dorak -d dorak"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - dorak-postgres:/var/lib/postgresql

volumes:
  dorak-postgres:
