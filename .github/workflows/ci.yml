name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:18-3.6-alpine
        env:
          POSTGRES_DB: dorak
          POSTGRES_USER: dorak
          POSTGRES_PASSWORD: dorak_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dorak -d dorak"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://dorak:dorak_ci_only@localhost:5432/dorak
      DATABASE_POOL_MAX: 2
      BETTER_AUTH_SECRET: ci-only-secret-at-least-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
      DORAK_CONTACT_EMAIL: ci@example.invalid
      DORAK_DEMO_AUTH: "true"
      DORAK_OPS_USERNAME: ci-operator
      DORAK_OPS_PASSWORD: ci-only-ops-password-at-least-32-characters
      DORAK_EXPECT_OPS_AUTH: "true"

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 20.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      # The seed script imports workspace packages through their built exports.
      - run: pnpm --filter @dorak/db build
      - run: pnpm --filter @dorak/server-catalog build
      - run: pnpm db:seed
      - run: pnpm db:smoke
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: HTTP smoke
        run: |
          VERCEL=1 VERCEL_ENV=preview pnpm --filter @dorak/web start > /tmp/dorak-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"; cat /tmp/dorak-next.log' EXIT
          pnpm smoke:http
