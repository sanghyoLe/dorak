openapi: 3.1.2
info:
  title: DORAK Operations API
  version: 0.3.0
  description: 식당 후보와 공개 리뷰를 검수하는 내부 운영 계약입니다.
servers:
  - url: http://localhost:3000/api
    description: Local development
tags:
  - name: candidates
  - name: reviews
security:
  - basicAuth: []
paths:
  /v1/ops/candidates:
    get:
      operationId: listPendingCandidates
      tags: [candidates]
      responses:
        "200":
          description: Pending ingestion candidates.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/IngestionCandidate" }
                  meta:
                    type: object
                    required: [total, dataMode]
                    properties:
                      total: { type: integer, minimum: 0 }
                      dataMode: { $ref: "#/components/schemas/CatalogMode" }
  /v1/ops/candidates/{candidateId}/approve:
    post:
      operationId: approveCandidate
      tags: [candidates]
      parameters:
        - $ref: "#/components/parameters/CandidateId"
      responses:
        "200":
          $ref: "#/components/responses/ReviewedCandidate"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/ops/candidates/{candidateId}/reject:
    post:
      operationId: rejectCandidate
      tags: [candidates]
      parameters:
        - $ref: "#/components/parameters/CandidateId"
      responses:
        "200":
          $ref: "#/components/responses/ReviewedCandidate"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/ops/reviews/{reviewId}/hide:
    post:
      operationId: hideReview
      tags: [reviews]
      parameters:
        - $ref: "#/components/parameters/ReviewId"
      responses:
        "200":
          description: Review was removed from public results and its branch score was recalculated.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/OpsReview" }
        "401":
          description: Operations authentication is required.
        "403":
          description: Cross-site mutation was rejected.
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  parameters:
    CandidateId:
      name: candidateId
      in: path
      required: true
      schema:
        type: string
        pattern: "^cand_[A-Za-z0-9_-]{16,32}$"
    ReviewId:
      name: reviewId
      in: path
      required: true
      schema:
        type: string
        pattern: "^rv_[A-Za-z0-9_-]{16,32}$"
  responses:
    ReviewedCandidate:
      description: Candidate review decision was applied.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: "#/components/schemas/IngestionCandidate" }
    NotFound:
      description: Pending candidate does not exist.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [error]
            properties:
              error:
                type: object
                additionalProperties: false
                required: [code, message]
                properties:
                  code: { type: string }
                  message: { type: string }
  schemas:
    CatalogMode:
      type: string
      enum: [memory, postgres]
    DataProvenance:
      type: string
      enum: [synthetic, approved_source]
    IngestionCandidate:
      type: object
      additionalProperties: false
      required:
        - id
        - sourceName
        - sourceRecordId
        - proposedName
        - proposedAddress
        - cuisineLabel
        - confidence
        - status
        - provenance
        - createdAt
      properties:
        id:
          type: string
          pattern: "^cand_[A-Za-z0-9_-]{16,32}$"
        sourceName: { type: string, minLength: 1, maxLength: 120 }
        sourceRecordId: { type: string, minLength: 1, maxLength: 200 }
        proposedName: { type: string, minLength: 1, maxLength: 120 }
        proposedAddress: { type: string, minLength: 1, maxLength: 240 }
        cuisineLabel: { type: string, minLength: 1, maxLength: 40 }
        confidence: { type: number, minimum: 0, maximum: 1 }
        status: { type: string, enum: [pending, approved, rejected] }
        provenance: { $ref: "#/components/schemas/DataProvenance" }
        createdAt: { type: string, format: date-time }
    OpsReview:
      type: object
      additionalProperties: false
      required:
        - publicId
        - branchPublicId
        - branchName
        - authorName
        - rating
        - body
        - visitedOn
        - identityVerified
        - visitVerification
        - status
        - createdAt
      properties:
        publicId:
          type: string
          pattern: "^rv_[A-Za-z0-9_-]{16,32}$"
        branchPublicId:
          type: string
          pattern: "^br_[A-Za-z0-9_-]{16,32}$"
        branchName: { type: string }
        authorName: { type: string, minLength: 2, maxLength: 20 }
        rating: { type: integer, minimum: 1, maximum: 5 }
        body: { type: string, minLength: 20, maxLength: 1000 }
        visitedOn: { type: [string, "null"], format: date }
        identityVerified: { type: boolean }
        visitVerification:
          type: string
          enum: [self_reported, receipt, reservation]
        status: { type: string, enum: [published, hidden] }
        createdAt: { type: string, format: date-time }
